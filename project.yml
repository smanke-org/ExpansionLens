# Source of truth for the Xcode project: run `xcodegen generate` after adding files or
# changing settings. ExpansionLensKit (Package.swift) holds the logic and its tests.
#
# Configurations:
#   Debug     Signed for development (CloudKit's Development environment), not sandboxed.
#   Release   GitHub build: archived, then exported for Developer ID by build_app.sh, which
#             has Xcode fetch the Developer ID provisioning profile CloudKit needs.
# Both sync through CloudKit (container iCloud.com.smanke.ExpansionLens), so the app is
# signed automatically with a provisioning profile. There is no App Store build: expansion
# needs an event tap and synthetic keys, which the sandbox doesn't allow.
name: ExpansionLens
options:
  bundleIdPrefix: com.smanke
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  ExpansionLensKit:
    path: .
configs:
  Debug: debug
  Release: release
settings:
  base:
    DEVELOPMENT_TEAM: 32CWL275JJ
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Developer ID Application"
    OTHER_CODE_SIGN_FLAGS: "--timestamp"
    ARCHS: "arm64 x86_64"
    ONLY_ACTIVE_ARCH: NO
    DEAD_CODE_STRIPPING: YES
  configs:
    Debug:
      ONLY_ACTIVE_ARCH: YES
    Release:
      # Xcode otherwise adds get-task-allow, which notarization rejects.
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
targets:
  ExpansionLens:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Resources/AppIcon.icns
        buildPhase: resources
    dependencies:
      - package: ExpansionLensKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.smanke.ExpansionLens
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/ExpansionLens.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Resources/ExpansionLens-Debug.entitlements
schemes:
  ExpansionLens:
    build:
      targets:
        ExpansionLens: all
    run:
      config: Debug
    archive:
      config: Release
